name: Deploy leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'leaderboard/**'
      - '.github/workflows/deploy-leaderboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-lite-leaderboard
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: leaderboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test leaderboard
        run: npm test
      - name: Build leaderboard
        run: npm run build
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
